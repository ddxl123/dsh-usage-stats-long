# The dsh-usage-stats-long bundle patch.
#
# Applied after @deepseek-ai/dsh-base, this layer inserts one host row that
# provides the `usageStats` service and registers the `usage_stats`,
# `usage_sessions` and `usage_calls` tools.
#
# The row is host-plane, not preset-plane: it reads the shared session corpus
# and owns no per-agent state, so every session sees one consistent answer and
# the fold cache is shared instead of rebuilt per agent.
#
# Every value below is overridable from a later layer (`$DSH_HOME/cordis.patch.yml`
# or a `--patch` overlay); a patch replaces a row's whole `config`, so restate
# every key you need.

- insert:
    - id: usage-stats
      name: 'dsh-usage-stats-long'
      config:
        # Empty means "$DSH_HOME/sessions", resolved by the plugin at load time.
        sessionsRoot: ''
        # Point this at a JSON price book to enable cost columns. Empty means
        # costs are omitted rather than guessed.
        priceBookPath: ''
        # Folded sessions retained between queries, keyed by path+size+mtime.
        cacheSize: 256
        registerTools: true
        # The plugin starts its own dashboard server with the harness, on its
        # own port, so the page does not depend on the harness webserver at all.
        # Set web: false to disable it.
        web: true
        # Loopback by default: the page is never exposed by accident.
        webHost: '127.0.0.1'
        # First port to try. If it is taken the next few are tried in turn, so a
        # second harness gets its own page instead of a failed plugin.
        webPort: 3090
        webPortAttempts: 10
        # How long a rendered page is reused before it is rebuilt. The corpus
        # changes only when a turn is appended, so this is what makes a refresh
        # a cache hit while the page stays live.
        webTtlMs: 10000
